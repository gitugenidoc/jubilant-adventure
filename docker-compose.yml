version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: genidoc_postgres
    environment:
      POSTGRES_USER: genidoc
      POSTGRES_PASSWORD: genidoc123
      POSTGRES_DB: genidoc_hospital
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genidoc"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - genidoc_network

  # Adminer - Database Management UI
  adminer:
    image: adminer:latest
    container_name: genidoc_adminer
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - genidoc_network

  # Redis Cache (optional, for future queue support)
  redis:
    image: redis:7-alpine
    container_name: genidoc_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - genidoc_network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: genidoc_backend
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://genidoc:genidoc123@postgres:5432/genidoc_hospital
      - JWT_SECRET=dev-secret-key-change-in-production
      - JWT_REFRESH_SECRET=dev-refresh-secret-key-change-in-production
      - REDIS_URL=redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    command: npm run dev
    networks:
      - genidoc_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend (optional for local dev)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: genidoc_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    environment:
      - VITE_API_BASE_URL=http://localhost:3000/api
    command: npm run dev
    networks:
      - genidoc_network
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:

networks:
  genidoc_network:
    driver: bridge
