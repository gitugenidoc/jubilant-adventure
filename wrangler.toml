{
  "name": "genidoc-hayat",
  "main": "backend/src/server.js",
  "compatibility_date": "2024-01-01",
  "compatibility_flags": ["nodejs_compat"],
  "d1_databases": [
    {
      "binding": "DB",
      "database_name": "genidoc-db",
      "database_id": "placeholder-id-to-be-replaced-after-creation"
    }
  ],
  "r2_buckets": [
    {
      "binding": "DOCUMENTS",
      "bucket_name": "genidoc-hospital-docs"
    }
  ],
  "assets": {
    "directory": "frontend/dist",
    "binding": "ASSETS"
  },
  "vars": {
    "NODE_ENV": "production",
    "API_ROOT": "/api"
  }
}
