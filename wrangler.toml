name = "genidoc-hayat"
main = "backend/src/server.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "genidoc_db1"
database_name = "genidoc-db1"
database_id = "b280bdaf-52dc-447e-8fd6-1274889211ac"

[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "genidoc-hospital-docs"

[assets]
directory = "frontend/dist"
binding = "ASSETS"

[vars]
NODE_ENV = "production"
API_ROOT = "/api"
